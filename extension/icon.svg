<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#3BA9F5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2E7BE8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#EAFEFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#7DF9FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>

  <!-- il fascio: dal punto sorgente si allarga verso destra -->
  <path d="M34 64 L116 22 L116 106 Z" fill="url(#ray)"/>
  <path d="M34 64 L116 41 L116 87 Z" fill="#CFF6FF" opacity="0.35"/>

  <!-- sorgente -->
  <circle cx="34" cy="64" r="20" fill="url(#glow)"/>
  <circle cx="34" cy="64" r="9" fill="#F2FEFF"/>
</svg>
