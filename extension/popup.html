<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beam</title>
<style>
  :root {
    --bg: #ffffff; --fg: #101720; --muted: #5d6b7a; --line: #e3e8ee;
    --ok: #0f9d58; --ko: #d93025; --accent: #2E7BE8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12181f; --fg: #e8eef5; --muted: #93a2b3; --line: #253040; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 272px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
  .state {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 14px 0; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 9px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.off { background: var(--ko); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ko) 20%, transparent); }
  .state b { font-weight: 600; }
  .state span { color: var(--muted); font-size: 11px; display: block; }
  dl { margin: 10px 14px 0; font-size: 11.5px; }
  dl div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; }
  dt { color: var(--muted); flex: none; }
  dd { margin: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=number] {
    font: inherit; font-size: 11.5px; width: 68px; text-align: right; color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px;
  }
  footer { display: flex; gap: 8px; padding: 12px 14px 14px; }
  button {
    font: inherit; font-size: 12px; padding: 7px 10px; cursor: pointer;
    border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  footer button { flex: 1; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.06); }
  .hint { padding: 0 14px 12px; font-size: 11px; color: var(--muted); }
  details { margin: 0 14px 14px; }
  summary { font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
  summary:hover { color: var(--fg); }
  #debug-out {
    margin: 8px 0 0; padding: 8px; max-height: 160px; overflow: auto;
    border: 1px solid var(--line); border-radius: 7px;
    background: color-mix(in srgb, var(--fg) 4%, transparent);
    font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; user-select: text;
  }
  details button { margin-top: 8px; width: 100%; }
  body:has(#debug[open]) { width: 380px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Beam</h1>
      <p>the page as text</p>
    </div>
  </header>

  <div class="state">
    <i class="dot" id="dot"></i>
    <div>
      <b id="label">checking…</b>
      <span id="sub"></span>
    </div>
  </div>

  <dl>
    <div><dt>hub port</dt><dd><input type="number" id="port" min="1" max="65535" step="1"></dd></div>
    <div><dt>bound tab</dt><dd id="tab">none</dd></div>
    <div><dt>version</dt><dd id="ver">—</dd></div>
  </dl>

  <footer>
    <button class="primary" id="reconnect">Reconnect</button>
    <button id="unbind">Release tab</button>
  </footer>

  <p class="hint" id="hint"></p>

  <details id="debug">
    <summary>Debug — copy this if it will not connect</summary>
    <button type="button" id="copy">Copy</button>
    <pre id="debug-out"></pre>
  </details>

  <script src="popup.js"></script>
</body>
</html>
