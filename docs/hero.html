<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beam</title>
<style>
  :root {
    --bg: #080c12;
    --panel: #0e141c;
    --fg: #e8eef5;
    --muted: #7d8b9a;
    --line: #1c2733;
    --cyan: #7DF9FF;
    --blue: #2E7BE8;
    --ok: #3dbe74;
    --str: #c9e7ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 920px; height: 540px; overflow: hidden; background: var(--bg); color: var(--fg); }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; left: 250px; top: 160px; width: 400px; height: 240px;
    background: radial-gradient(ellipse at center, rgba(125,249,255,.08), transparent 70%);
    pointer-events: none;
  }
  header.top {
    position: absolute; left: 28px; right: 28px; top: 18px;
    display: flex; align-items: center; justify-content: space-between;
    height: 28px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand b { font-size: 13px; font-weight: 600; letter-spacing: -.02em; }
  .brand span { color: var(--muted); font-size: 11px; margin-left: 2px; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
  }
  .pill i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 3px rgba(61,190,116,.18);
  }
  .stage {
    position: relative; z-index: 1;
    height: 540px; padding: 28px 28px 22px;
    display: grid;
    grid-template-columns: 300px 48px 1fr;
  }
  .agent, .tab {
    margin-top: 36px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 12px; overflow: hidden; height: 430px;
    display: flex; flex-direction: column;
    position: relative; z-index: 1;
  }
  .bar {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: 11px 14px 9px;
    border-bottom: 1px solid var(--line); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .bar em { font-style: normal; color: #4a5a6a; font-size: 10px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .url {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #8b9aaa;
  }
  .url s {
    text-decoration: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); display: block; flex: none;
  }
  .say {
    margin: 16px 14px 12px; padding: 10px 12px;
    background: #0a1017; border: 1px solid var(--line); border-radius: 8px;
    color: #c5d0da; font-size: 13px; line-height: 1.45;
  }
  .say small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
  pre {
    flex: 1; padding: 6px 16px 16px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    white-space: pre; overflow: hidden; color: var(--fg);
  }
  .tab pre { padding-top: 12px; }
  .p { color: var(--cyan); }
  .m { color: var(--muted); }
  .u { color: #5b6b7a; }
  .h { color: #b7c4d0; }
  .r { color: var(--blue); font-weight: 600; }
  .k { color: #9aa8b5; }
  .v { color: var(--str); }
  .x { color: #6a7886; }
  .ok { color: var(--ok); }
  .dim { color: #4a5a6a; }
  .caret {
    display: inline-block; width: 7px; height: 13px; background: var(--cyan);
    transform: translateY(2px); opacity: 0;
  }
  .caret.show { opacity: 1; }
  .hit { background: rgba(125,249,255,.12); border-radius: 3px; }
  .tab pre { white-space: pre; word-break: normal; }
  .beam {
    align-self: center;
    width: 48px; height: 72px;
    margin-top: 36px;
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <header class="top">
    <div class="brand">
      <img src="../extension/icon.svg" alt="">
      <b>Beam</b><span>AI → your Chrome, as text</span>
    </div>
    <div class="pill"><i></i> your session · no extra profile</div>
  </header>

  <div class="stage">
    <section class="agent">
      <div class="bar">agent <em>CLI</em></div>
      <div class="say">
        <small>intent</small>
        Read the open tab. Change the tagline. Don’t save.
      </div>
      <pre id="cli"></pre>
    </section>

    <svg class="beam" viewBox="0 0 56 80" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7DF9FF" stop-opacity=".15"/>
          <stop offset="1" stop-color="#2E7BE8" stop-opacity=".55"/>
        </linearGradient>
      </defs>
      <path d="M2 40 L54 8 L54 72 Z" fill="url(#ray)"/>
      <path d="M2 40 L54 24 L54 56 Z" fill="#CFF6FF" opacity=".28"/>
      <circle cx="6" cy="40" r="5" fill="#F2FEFF"/>
    </svg>

    <section class="tab">
      <div class="bar">bound tab <em id="meta">waiting</em></div>
      <div class="url"><s></s><span>app.example.com/projects/1842/settings</span></div>
      <pre id="page"></pre>
    </section>
  </div>

<script>
const SNAP = [
  ['h', 'h1 Project settings'],
  ['row', ['@0', 'input:text', 'Name', '"Northwind"', '']],
  ['row', ['@1', 'input:text', 'Tagline', '"Ship faster"', '']],
  ['row', ['@2', 'textarea', 'Summary', '"Internal notes…"', '']],
  ['row', ['@3', 'select', 'Visibility', '"Private"', '']],
  ['row', ['@4', 'button', 'Save', '', '']],
];
const SET = '$ beam set @copy.json';

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function row(parts, hitKicker) {
  const [ref, kind, label, value, extra] = parts;
  const hit = hitKicker && ref === '@1';
  const val = hit ? '"Built to last."' : value;
  let html = `<span class="r">${ref}</span> <span class="k">${esc(kind)}</span>`;
  if (label) html += ` <span class="${hit ? 'hit' : ''}">"${esc(label)}"</span>`;
  if (val) html += ` <span class="m">=</span> <span class="v">${esc(val)}</span>`;
  if (extra) html += `<span class="x">${esc(extra)}</span>`;
  return html;
}
function type(full, t, start, cps) {
  if (t < start) return '';
  return full.slice(0, Math.max(0, Math.floor((t - start) * cps)));
}
function caret(show) {
  return `<span class="caret${show ? ' show' : ''}"></span>`;
}

window.seek = function (t) {
  const written = t >= 4.35;
  document.getElementById('meta').textContent = written ? '1 round trip' : '6 lines · no screenshot';

  let cli = `<span class="p">$ beam snap</span>\n<span class="dim">6 lines · 5 elements</span>\n\n`;
  if (t >= 2.2) {
    const setCmd = type(SET, t, 2.2, 28);
    cli += `<span class="p">${esc(setCmd)}</span>${caret(t >= 2.2 && t < 4.15 && Math.floor(t * 6) % 2 === 0)}\n`;
  }
  if (t >= 4.25) cli += `<span class="ok">filled 1</span>\n<span class="dim">same tab · your cookies</span>\n`;
  document.getElementById('cli').innerHTML = cli;

  let page = '';
  for (let i = 0; i < SNAP.length; i++) {
    const [k, v] = SNAP[i];
    page += (k === 'row' ? row(v, written) : `<span class="${k}">${esc(v)}</span>`) + '\n';
  }
  document.getElementById('page').innerHTML = page;
};

window.BEAM_RECORD = false;
(function loop(now) {
  if (window.BEAM_RECORD) return;
  if (!loop.t0) loop.t0 = now;
  window.seek(((now - loop.t0) / 1000) % 7.0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
